<html lang="ja">
<head>
  <meta charset="UTF-8">

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    overflow: hidden;
    }

    .hero__visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    }

  <title>Document</title>

  <!--css-->

  <!--Googlefonts-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- include -->
  <div id="header"></div>

    <div class="header__name__sp">
    <p>KOAKUTSU NATSUMI</p>
  </div>

<section class="hero hero__lower-page" id="top">

  <!-- sidebarの背後になる領域 -->
  <div class="hero__sidebar-space hero__sidebar-space__lower-page"></div>

  <!-- DESIGN -->
  <div class="hero__marquee hero__marquee__lower-page">

    <div class="hero__marquee-track hero__marquee-track__lower-page">

      <div class="hero__marquee-item hero__marquee-item__lower-page">
        <img src="/public/logodesign.svg" alt="">
      </div>

      <div class="hero__marquee-item hero__marquee-item__lower-page">
        <img src="/public/logodesign.svg" alt="">
      </div>

      <div class="hero__marquee-item hero__marquee-item__lower-page">
        <img src="/public/logodesign.svg" alt="">
      </div>

    </div>

  </div>

</section>

  <!-- =========================
    CONTACT
========================== -->
<section class="contact-section" id="contact">

  <div class="contact-section__inner">

    <!-- CONTACT SVG -->
    <div class="contact-section__heading">
      <img src="/contact.svg" alt="CONTACT" class="contact-section__title">
    </div>


    <!-- Contact Form -->
    <form class="contact-form">

      <div class="contact-form__group">
        <label for="name" class="contact-form__label">
          お名前または会社名
          <span>*</span>
        </label>

        <input type="text" id="name" name="name" class="contact-form__input" required>
      </div>


      <div class="contact-form__group">
        <label for="email" class="contact-form__label">
          メールアドレス
          <span>*</span>
        </label>

        <input type="email" id="email" name="email" class="contact-form__input" placeholder="メールアドレスを入力" required>
      </div>


      <div class="contact-form__group">
        <label for="message" class="contact-form__label">
          お問い合わせ内容
          <span>*</span>
        </label>

        <textarea id="message" name="message" class="contact-form__textarea" placeholder="例）新規店舗立ち上げに伴い、自社のロゴを作りたい" required></textarea>
      </div>


      <button type="submit" class="contact-form__button">送信する</button>

    </form>

  </div>

</section>
      <!-- include -->
  <div id="footer"></div>

  <!-- ========================================
    MOBILE MENU
========================================= -->

  <nav class="mobile-menu__nav">

    <a href="/banner.html">BANNER</a>
    <a href="/movie.html">MOVIE</a>
    <a href="/about.html">ABOUT</a>
    <a href="/contact.html">CONTACT</a>
  </nav>

  <div class="mobile-menu__brand">

    <img
      src="/vector_logo.svg"
      alt=""
      class="mobile-menu__logo"
    >

    <div class="mobile-menu__name">
      <p>
        KOAKUTSU<br>
        NATSUMI
      </p>

      <span>Designer</span>
    </div>

  </div>

</div>

  <!-- ハンバーガーボタン -->
<button class="mobile-menu-button" type="button">
  <span class="mobile-menu-button__text">menu</span>
</button>

<div class="custom-cursor"></div>

  <script type="module" src="/src/main.ts"></script><!--typescriptを読み込むために必要-->
</body>

</html>
