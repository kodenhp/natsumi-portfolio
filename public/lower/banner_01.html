          <div class="work-card__body work-card__body__web  work-card__body__logo">

              BANNER DESIGN
            </span>

          <div class="work_desc work_desc_logo">
            <p>20代後半から30代前半のトレンドに敏感な女性がターゲット。商材の購入やサービスの利用がほぼ確定しており、最終決定出来る情報が欲しい人。広告用バナーとして、商品の購買ページや商品サービスのページへリンクする際に使用。</p>
          </div>

          <div class="work-card__image work-card__image__web  work-card__image__flex">

          <div class="work_desc work_desc_flex">
            <p  class="designprocess">DESIGN  PROCESS</p>
            <p class="designprocess_text">広告表示で流れてきた際に目に止まるよう、視線誘導や配色、写真や文字のレイアウトを工夫し、情報の優先度を考慮しつつ構成しました。赤色のジャケットがしっかり目立つように、背景は補色×白でパキッとしたデザインにしています。</p>
          </div>

          </div>
